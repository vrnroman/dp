# This is the contract. The platform reads it and knows exactly how to ship this app.
# A non-engineer never writes this by hand; Claude writes it, and the platform checks it.
name: guestbook
blueprint: web
profile: personal

web:
  framework: nextjs

database:
  engine: postgres
  migrations: ./migrations

auth:
  tier: proper          # Google sign-in with a verified identity
  signup: open          # anyone can sign in; the owner decides what each person can do
  roles:                # the app declares roles; the platform maps people to them
    - name: viewer
      can: read the guestbook
    - name: editor
      can: leave notes
  default: viewer        # everyone who signs in can read

storage:
  buckets:
    - photos

env:
  optional:
    - GUESTBOOK_TITLE
